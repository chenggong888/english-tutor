<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FF6B35">
<title>小E老师 · AI英语私教</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8F0;--card:#FFF;--primary:#FF6B35;--primary-light:#FFF0E8;--success:#22C55E;--success-light:#DCFCE7;--danger:#EF4444;--danger-light:#FEE2E2;--blue:#3B82F6;--blue-light:#DBEAFE;--purple:#8B5CF6;--purple-light:#EDE9FE;--text:#1E293B;--muted:#64748B;--border:#E2E8F0;--gold:#F59E0B}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito','Noto Sans SC','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app-container{max-width:900px;margin:0 auto;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input{font-family:inherit;outline:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes typing{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes xpFloat{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-50px)}}
.fade-in{animation:fadeIn .35s ease-out}.pop-in{animation:popIn .3s ease-out}
.header{background:linear-gradient(135deg,var(--primary),#FF8C42);padding:24px 32px;color:#fff;position:relative;overflow:hidden}
.header-emoji{position:absolute;top:-15px;right:10px;font-size:90px;opacity:.15}
.header-sub{font-size:13px;opacity:.85;margin-bottom:2px}
.header-title{font-size:26px;font-weight:900;margin-bottom:10px}
.xp-bar-bg{background:rgba(255,255,255,.25);border-radius:8px;height:14px;overflow:hidden}
.xp-bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#FDE68A,#F59E0B);transition:width .6s}
.xp-info{display:flex;justify-content:space-between;font-size:12px;margin-top:6px;opacity:.85}
.nav{display:flex;border-bottom:2px solid var(--border);background:var(--card);position:sticky;top:0;z-index:50}
.nav-btn{flex:1;padding:14px 0;font-size:14px;font-weight:700;background:none;color:var(--muted);border-bottom:3px solid transparent}
.nav-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.home-content{padding:24px 32px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.menu-card{display:flex;align-items:center;gap:14px;background:var(--card);padding:18px 20px;border-radius:16px;border:2px solid var(--border);text-align:left;width:100%}
.menu-card:active{transform:scale(.97)}.menu-card.full-width{grid-column:1/-1}
.menu-icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.menu-title{font-size:16px;font-weight:800}.menu-sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.unit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.unit-card{padding:16px;border-radius:14px;text-align:center;border:2px solid var(--border);background:var(--card)}
.unit-card.active{border-color:var(--primary);background:var(--primary-light)}
.unit-card:active{transform:scale(.96)}
.chat-wrapper{display:flex;flex-direction:column;height:calc(100vh - 140px)}
.chat-area{flex:1;overflow-y:auto;padding:24px 32px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:75%;padding:14px 18px;border-radius:18px;font-size:15px;font-weight:600;line-height:1.7;animation:fadeIn .3s}
.msg-ai{background:var(--card);border:1.5px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.msg-user{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg-ai .en-text{color:var(--blue);font-weight:800;cursor:pointer}
.typing-dots{display:flex;gap:4px;padding:14px 20px;align-self:flex-start}
.typing-dots span{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:typing 1s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}.typing-dots span:nth-child(3){animation-delay:.4s}
.quick-replies{display:flex;flex-wrap:wrap;gap:8px;padding:0 32px 10px}
.quick-btn{padding:10px 18px;border-radius:20px;font-size:14px;font-weight:700;background:var(--primary-light);color:var(--primary);border:1.5px solid #FFD4C0}
.quick-btn:active{background:var(--primary);color:#fff}
.input-bar{display:flex;gap:10px;padding:14px 32px;background:var(--card);border-top:2px solid var(--border);position:sticky;bottom:0}
.input-field{flex:1;padding:14px 20px;border-radius:24px;border:2px solid var(--border);font-size:16px;font-weight:600;background:var(--bg)}
.input-field:focus{border-color:var(--primary)}
.send-btn{padding:14px 24px;border-radius:24px;font-size:16px;font-weight:800;background:var(--primary);color:#fff}
.send-btn:disabled{opacity:.4}
.cards-content{padding:24px 32px}
.flashcard{background:var(--card);border-radius:24px;padding:48px 32px;text-align:center;box-shadow:0 6px 25px rgba(0,0,0,.07);border:2px solid var(--border);margin:16px 0}
.flash-en{font-size:36px;font-weight:900;margin-bottom:8px}
.flash-sentence{font-size:14px;color:var(--muted);font-style:italic;margin-bottom:20px}
.flash-cn{font-size:28px;font-weight:800;color:var(--primary);animation:popIn .3s}
.btn-primary{display:block;width:100%;padding:16px;border-radius:16px;font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--primary),#FF8C42);color:#fff;box-shadow:0 4px 14px rgba(255,107,53,.3);margin-top:14px}
.btn-primary:active{transform:scale(.97)}
.btn-outline{padding:12px 24px;border-radius:14px;font-size:15px;font-weight:700;background:var(--blue-light);color:var(--blue);display:inline-block}
.progress-content{padding:24px 32px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-card{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:20px}
.stat-card.full-width{grid-column:1/-1}
.stat-label{font-size:13px;color:var(--muted);font-weight:700}
.stat-value{font-size:32px;font-weight:900}
.xp-popup{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--gold);color:#fff;padding:8px 22px;border-radius:20px;font-weight:800;font-size:18px;z-index:999;box-shadow:0 4px 18px rgba(245,158,11,.4);animation:xpFloat 1.3s ease-out forwards}
@media(max-width:640px){.header{padding:20px 16px}.header-title{font-size:22px}.home-content,.cards-content,.progress-content{padding:16px}.chat-area{padding:16px}.input-bar{padding:12px 16px}.quick-replies{padding:0 16px 8px}.menu-grid{grid-template-columns:1fr}.unit-grid{grid-template-columns:repeat(2,1fr)}.stat-grid{grid-template-columns:1fr}.msg{max-width:88%;font-size:14px}.flashcard{padding:32px 20px}.flash-en{font-size:28px}.flash-cn{font-size:22px}}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}
</style>
</head>
<body>
<div class="app-container" id="app"></div>
<script>
var UNITS=[
{id:1,title:"My school",emoji:"🏫",words:[{en:"playground",cn:"操场",sentence:"Go to the playground."},{en:"library",cn:"图书馆",sentence:"Go to the library."},{en:"teachers' office",cn:"教师办公室",sentence:"This is the teachers' office."},{en:"garden",cn:"花园",sentence:"Go to the garden."},{en:"computer room",cn:"计算机房",sentence:"Where is the computer room?"},{en:"art room",cn:"美术教室",sentence:"The art room is on the second floor."},{en:"music room",cn:"音乐教室",sentence:"Is this the music room?"},{en:"gym",cn:"体育馆",sentence:"Let's go to the gym."},{en:"first floor",cn:"一楼",sentence:"It's on the first floor."},{en:"second floor",cn:"二楼",sentence:"It's on the second floor."}],sentences:[{en:"Where is the library?",cn:"图书馆在哪里？"},{en:"It's on the first floor.",cn:"在一楼。"},{en:"Is this the teachers' office?",cn:"这是教师办公室吗？"},{en:"Do you have a gym?",cn:"你们有体育馆吗？"},{en:"Yes, we do.",cn:"是的，我们有。"}],grammar:"Where is+地点? Is this/that...?",roleplay:"Tom参观学校"},
{id:2,title:"What time is it?",emoji:"⏰",words:[{en:"breakfast",cn:"早餐",sentence:"It's time for breakfast."},{en:"lunch",cn:"午餐",sentence:"It's time for lunch."},{en:"dinner",cn:"晚餐",sentence:"It's time for dinner."},{en:"English class",cn:"英语课",sentence:"It's time for English class."},{en:"music class",cn:"音乐课",sentence:"It's time for music class."},{en:"PE class",cn:"体育课",sentence:"It's time for PE class."},{en:"get up",cn:"起床",sentence:"It's time to get up."},{en:"go to school",cn:"上学",sentence:"It's time to go to school."},{en:"go home",cn:"回家",sentence:"It's time to go home."},{en:"go to bed",cn:"睡觉",sentence:"It's time to go to bed."}],sentences:[{en:"What time is it?",cn:"几点了？"},{en:"It's 6 o'clock.",cn:"六点了。"},{en:"It's time for dinner.",cn:"该吃晚餐了。"},{en:"It's time to get up.",cn:"该起床了。"}],grammar:"It's time for+名词 vs It's time to+动词",roleplay:"模拟一天"},
{id:3,title:"Weather",emoji:"🌤️",words:[{en:"cold",cn:"冷",sentence:"It's cold outside."},{en:"cool",cn:"凉爽",sentence:"It's cool today."},{en:"warm",cn:"温暖",sentence:"It's warm in spring."},{en:"hot",cn:"热",sentence:"It's hot in summer."},{en:"sunny",cn:"晴朗",sentence:"It's sunny today."},{en:"windy",cn:"有风",sentence:"It's windy outside."},{en:"cloudy",cn:"多云",sentence:"It's cloudy today."},{en:"snowy",cn:"下雪",sentence:"It's snowy in winter."},{en:"rainy",cn:"下雨",sentence:"It's rainy."}],sentences:[{en:"What's the weather like?",cn:"天气怎么样？"},{en:"It's hot and sunny.",cn:"又热又晴。"},{en:"Can I go outside?",cn:"我能出去吗？"}],grammar:"What's the weather like in+地点?",roleplay:"天气预报员"},
{id:4,title:"At the farm",emoji:"🐄",words:[{en:"tomato",cn:"西红柿",sentence:"Look at the tomatoes."},{en:"potato",cn:"土豆",sentence:"These are potatoes."},{en:"green beans",cn:"豆角",sentence:"I like green beans."},{en:"carrot",cn:"胡萝卜",sentence:"The carrots are orange."},{en:"horse",cn:"马",sentence:"They are horses."},{en:"cow",cn:"奶牛",sentence:"Look at the cows."},{en:"sheep",cn:"绵羊",sentence:"These are sheep."},{en:"hen",cn:"母鸡",sentence:"The hens are fat."}],sentences:[{en:"What are these?",cn:"这些是什么？"},{en:"They're tomatoes.",cn:"是西红柿。"},{en:"What are those?",cn:"那些是什么？"},{en:"How many horses?",cn:"多少匹马？"}],grammar:"What are these/those? 复数规则",roleplay:"参观农场"},
{id:5,title:"My clothes",emoji:"👗",words:[{en:"hat",cn:"帽子",sentence:"This is my hat."},{en:"dress",cn:"连衣裙",sentence:"The dress is pretty."},{en:"skirt",cn:"短裙",sentence:"Whose skirt is this?"},{en:"pants",cn:"裤子",sentence:"These are my pants."},{en:"shirt",cn:"衬衫",sentence:"Put on your shirt."},{en:"jacket",cn:"夹克",sentence:"Whose jacket is this?"},{en:"sweater",cn:"毛衣",sentence:"Put on your sweater."},{en:"shoes",cn:"鞋子",sentence:"Whose shoes are these?"},{en:"socks",cn:"袜子",sentence:"Put on your socks."}],sentences:[{en:"Whose coat is this?",cn:"这是谁的？"},{en:"It's mine.",cn:"是我的。"},{en:"Are these yours?",cn:"这些是你的吗？"},{en:"You look nice!",cn:"你真好看！"}],grammar:"Whose+名词? mine/yours 所有格",roleplay:"失物招领"},
{id:6,title:"Shopping",emoji:"🛍️",words:[{en:"gloves",cn:"手套",sentence:"These gloves are nice."},{en:"scarf",cn:"围巾",sentence:"The scarf is pretty."},{en:"umbrella",cn:"雨伞",sentence:"Can I have an umbrella?"},{en:"sunglasses",cn:"太阳镜",sentence:"The sunglasses are cool."},{en:"pretty",cn:"漂亮的",sentence:"The dress is pretty."},{en:"cheap",cn:"便宜的",sentence:"This one is cheap."},{en:"expensive",cn:"昂贵的",sentence:"That's too expensive."},{en:"try on",cn:"试穿",sentence:"Can I try them on?"},{en:"how much",cn:"多少钱",sentence:"How much is this?"}],sentences:[{en:"Can I help you?",cn:"需要帮忙吗？"},{en:"How much is this?",cn:"多少钱？"},{en:"That's expensive!",cn:"太贵了！"},{en:"I'll take it.",cn:"我买了。"}],grammar:"How much is/are? 购物用语",roleplay:"商店购物"}
];
var MT=3;
function bsp(uid,st){var u=UNITS.find(function(x){return x.id===uid});var ws=u.words.map(function(w){return w.en+"("+w.cn+")"}).join(", ");var ss=u.sentences.map(function(s){return s.en+"="+s.cn}).join("|");var sc=u.words.map(function(w){var s=st.wordScores[w.en]||0;return w.en+"(得分:"+s+"/"+MT+")"}).join(", ");
return "你是「小E老师」，四年级英语AI私教。\n\n性格：活泼有趣，善用emoji🎉⭐🔥，每次回复3-5句话，用中文交流教英文。\n\n教学原则：\n1.永远鼓励，答错说\"差一点💪\"答对说\"太棒了⭐\"\n2.多出选择题(A/B/C)\n3.英文用【】括起来\n4.回复末尾给快捷回复：[选项A] [选项B] [选项C]\n\n当前：Unit "+u.id+" "+u.title+" "+u.emoji+"\n词汇："+ws+"\n句型："+ss+"\n语法："+u.grammar+"\n角色扮演："+u.roleplay+"\n\n学生各词掌握："+sc+"\n（达到"+MT+"分=掌握，优先练低分词）\n\n⚠️重要标记规则⚠️\n每当学生回答了某个单词的测试后，在回复最末尾添加隐藏标记：\n- 答对：{{CORRECT:单词}}\n- 答错：{{WRONG:单词}}\n单词必须是词汇列表中的英文原词。每次只标记一个。没有测试就不加。\n\n其他：说\"开始学习\"从低分词教起，说\"考考我\"出选择题，说\"角色扮演\"进入场景对话。"}
function speak(t,r){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=r||.85;u.pitch=1.1;var vs=window.speechSynthesis.getVoices();var v=vs.find(function(v){return v.lang.startsWith("en")&&v.name.includes("Female")})||vs.find(function(v){return v.lang.startsWith("en")});if(v)u.voice=v;window.speechSynthesis.speak(u)}
if(window.speechSynthesis){window.speechSynthesis.getVoices();window.speechSynthesis.onvoiceschanged=function(){window.speechSynthesis.getVoices()}}
var LVS=[{lv:1,t:"英语小白",xp:0},{lv:2,t:"单词学徒",xp:100},{lv:3,t:"句子猎人",xp:250},{lv:4,t:"对话勇者",xp:500},{lv:5,t:"语法骑士",xp:800},{lv:6,t:"英语小达人",xp:1200},{lv:7,t:"英语小学霸",xp:1800}];
function clv(xp){var r=LVS[0];for(var i=0;i<LVS.length;i++){if(xp>=LVS[i].xp)r=LVS[i]}var n=LVS.find(function(l){return l.xp>xp});return{lv:r.lv,title:r.t,xp:r.xp,nextXp:n?n.xp:r.xp+600}}
function ld(){try{var s=JSON.parse(localStorage.getItem("et_v3"));if(s&&s.wordScores)return s}catch(e){}return{xp:0,level:1,lt:"英语小白",cu:1,wordScores:{},sess:0,tc:0,tw:0}}
function sv(s){var l=clv(s.xp);s.level=l.lv;s.lt=l.title;localStorage.setItem("et_v3",JSON.stringify(s))}
function gm(s){var c=0;for(var w in s.wordScores)if(s.wordScores[w]>=MT)c++;return c}
function gum(s,uid){var u=UNITS.find(function(x){return x.id===uid});var m=0;u.words.forEach(function(w){if((s.wordScores[w.en]||0)>=MT)m++});return{m:m,t:u.words.length,p:Math.round(m/u.words.length*100)}}
function gtw(){var t=0;UNITS.forEach(function(u){t+=u.words.length});return t}
async function cai(msgs,uid,st){try{var r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:msgs,system:bsp(uid,st)})});if(!r.ok)throw new Error();var d=await r.json();return d.reply}catch(e){return "小E老师短路了😅 请再试一次！"}}

function App(){
var st=ld(),ct="home",cms=[],dms=[],il=false,cu=st.cu||1,ci=0,cf=false,cm="words",xpp=null;
function sxp(a){xpp=a;rr();setTimeout(function(){xpp=null;rr()},1300)}
function axp(a){st.xp+=a;sv(st);sxp(a)}
function pai(text){
var cm2=text.match(/\{\{CORRECT:([^}]+)\}\}/);var wm=text.match(/\{\{WRONG:([^}]+)\}\}/);
if(cm2){var w=cm2[1].trim().toLowerCase();var f=null;UNITS.forEach(function(u){u.words.forEach(function(x){if(x.en.toLowerCase()===w)f=x.en})});if(f){st.wordScores[f]=(st.wordScores[f]||0)+1;st.tc++;axp(st.wordScores[f]>=MT?30:10);sv(st)}}
if(wm){var w2=wm[1].trim().toLowerCase();var f2=null;UNITS.forEach(function(u){u.words.forEach(function(x){if(x.en.toLowerCase()===w2)f2=x.en})});if(f2){st.wordScores[f2]=Math.max(0,(st.wordScores[f2]||0)-1);st.tw++;sv(st)}}
var ct2=text.replace(/\{\{(CORRECT|WRONG):[^}]+\}\}/g,"").trim();
var qr=[],qrx=/\[([^\]]+)\]/g,m;var ls=ct2.split("\n").slice(-3).join("\n");while((m=qrx.exec(ls))!==null)qr.push(m[1]);
if(qr.length>0)ct2=ct2.replace(/\n?\s*(\[[^\]]+\]\s*)+\s*$/g,"").trim();
var enx=/【([^】]+)】/g,et=[];while((m=enx.exec(ct2))!==null)et.push(m[1]);if(et.length>0)setTimeout(function(){speak(et[0])},500);
ct2=ct2.replace(/【([^】]+)】/g,'<span class="en-text" onclick="speak(\'$1\')">🔊 $1</span>');
return{dt:ct2,qr:qr}}

async function sm(t){if(il||!t.trim())return;cms.push({role:"user",content:t});dms.push({tp:"u",t:t});il=true;rr();sb();
var reply=await cai(cms,cu,st);cms.push({role:"assistant",content:reply});var p=pai(reply);dms.push({tp:"a",t:p.dt,qr:p.qr});
il=false;st.sess++;sv(st);rr();sb()}
function sb(){setTimeout(function(){var e=document.getElementById("ca");if(e)e.scrollTop=e.scrollHeight},100)}
function sc(msg){cms=[];dms=[];ct="chat";rr();sm(msg||"你好小E老师！")}

function rh(){var l=clv(st.xp);var p=l.nextXp>l.xp?((st.xp-l.xp)/(l.nextXp-l.xp)*100):100;var u=UNITS.find(function(x){return x.id===cu});var um=gum(st,cu);
return '<div class="header"><div class="header-emoji">'+u.emoji+'</div><div class="header-sub">小E老师的英语课堂</div><div class="header-title">Unit '+u.id+': '+u.title+' '+u.emoji+' <span style="font-size:14px;opacity:.8">掌握'+um.p+'%</span></div><div class="xp-bar-bg"><div class="xp-bar-fill" style="width:'+p+'%"></div></div><div class="xp-info"><span>⭐'+st.xp+' XP · 掌握'+gm(st)+'/'+gtw()+'词</span><span>Lv.'+l.lv+' '+l.title+'</span></div></div>'}

function rn(){var ts=[{i:"home",l:"🏠 首页"},{i:"chat",l:"💬 AI对话"},{i:"cards",l:"🔊 单词卡"},{i:"progress",l:"📊 成绩"}];return '<div class="nav">'+ts.map(function(t){return '<button class="nav-btn '+(ct===t.i?"active":"")+'" onclick="app.st(\''+t.i+'\')">'+t.l+'</button>'}).join("")+'</div>'}

function rho(){return '<div class="home-content fade-in"><div style="font-size:14px;color:var(--muted);font-weight:700;margin-bottom:10px">选择单元</div><div class="unit-grid">'+UNITS.map(function(u){var um=gum(st,u.id);return '<button class="unit-card '+(cu===u.id?"active":"")+'" onclick="app.su('+u.id+')"><div style="font-size:28px;margin-bottom:4px">'+u.emoji+'</div><div style="font-size:13px;font-weight:800">U'+u.id+' '+u.title+'</div><div style="font-size:10px;font-weight:800;color:'+(um.p>=100?'var(--success)':um.p>0?'var(--blue)':'var(--muted)')+';margin-top:4px">'+um.p+'%掌握</div></button>'}).join("")+'</div>'+
'<div style="font-size:14px;color:var(--muted);font-weight:700;margin:20px 0 10px">开始学习</div><div class="menu-grid">'+
'<button class="menu-card" onclick="app.sc(\'开始学习Unit '+cu+'的单词，从我掌握最低的词开始！\')"><div class="menu-icon" style="background:var(--blue-light)">🔊</div><div><div class="menu-title">AI 教单词</div><div class="menu-sub">优先教薄弱词汇</div></div></button>'+
'<button class="menu-card" onclick="app.sc(\'考考我Unit '+cu+'！出选择题！\')"><div class="menu-icon" style="background:var(--success-light)">🎯</div><div><div class="menu-title">AI 闯关测验</div><div class="menu-sub">答对3次才算掌握</div></div></button>'+
'<button class="menu-card" onclick="app.sc(\'角色扮演Unit '+cu+'！\')"><div class="menu-icon" style="background:var(--purple-light)">🎭</div><div><div class="menu-title">AI 角色扮演</div><div class="menu-sub">真实场景对话</div></div></button>'+
'<button class="menu-card" onclick="app.sc(\'复习之前的内容，考我没掌握的词！\')"><div class="menu-icon" style="background:var(--primary-light)">🔄</div><div><div class="menu-title">AI 智能复习</div><div class="menu-sub">针对薄弱词强化</div></div></button>'+
'<button class="menu-card full-width" onclick="app.st(\'cards\')"><div class="menu-icon" style="background:var(--danger-light)">📇</div><div><div class="menu-title">单词卡片</div><div class="menu-sub">语音翻卡·自主复习</div></div></button></div>'+
'<div style="margin-top:16px;padding:14px 16px;background:var(--blue-light);border-radius:14px;font-size:13px;color:var(--blue);font-weight:600;line-height:1.7">💡 每个单词答对'+MT+'次才算真正掌握，答错会倒扣1分。当前单元掌握'+gum(st,cu).p+'%</div></div>'}

function rc(){return '<div class="chat-wrapper"><div class="chat-area" id="ca">'+dms.map(function(m){if(m.tp==="u")return '<div class="msg msg-user">'+m.t+'</div>';var h='<div class="msg msg-ai">'+m.t+'</div>';if(m.qr&&m.qr.length>0)h+='<div class="quick-replies">'+m.qr.map(function(q){return '<button class="quick-btn" onclick="app.sm(\''+q.replace(/'/g,"\\'")+'\')">'+q+'</button>'}).join("")+'</div>';return h}).join("")+(il?'<div class="typing-dots"><span></span><span></span><span></span></div>':'')+'</div><div class="input-bar"><input class="input-field" id="ci" placeholder="用中文或英文回答..." onkeydown="if(event.key===\'Enter\')app.si()"/><button class="send-btn" onclick="app.si()" '+(il?"disabled":"")+'>发送</button></div></div>'}

function rca(){var u=UNITS.find(function(x){return x.id===cu});var ls=cm==="words"?u.words:u.sentences;var it=ls[ci]||ls[0];var sc2=st.wordScores[it.en]||0;
return '<div class="cards-content fade-in"><div style="display:flex;gap:10px;margin-bottom:16px"><button class="btn-outline" style="'+(cm==="words"?"background:var(--blue);color:#fff":"")+'" onclick="app.scm(\'words\')">单词</button><button class="btn-outline" style="'+(cm==="sentences"?"background:var(--blue);color:#fff":"")+'" onclick="app.scm(\'sentences\')">句型</button></div>'+
'<div style="display:flex;gap:4px;margin-bottom:8px">'+ls.map(function(_,i){var s=st.wordScores[ls[i].en]||0;var c=s>=MT?"var(--success)":s>0?"var(--blue)":"var(--border)";return '<div style="flex:1;height:5px;border-radius:3px;background:'+c+'"></div>'}).join("")+'</div>'+
'<div style="text-align:right;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:8px">'+(ci+1)+'/'+ls.length+(cm==="words"?" · 掌握度"+sc2+"/"+MT:"")+'</div>'+
'<div class="flashcard pop-in"><div class="flash-en">'+it.en+'</div>'+(it.sentence?'<div class="flash-sentence">"'+it.sentence+'"</div>':'')+
'<button class="btn-outline" onclick="speak(\''+it.en.replace(/'/g,"\\'")+'\')">🔊 听发音</button>'+(it.sentence?' <button class="btn-outline" style="margin-left:8px" onclick="speak(\''+it.sentence.replace(/'/g,"\\'")+'\')">🔊 听例句</button>':'')+
'<div style="margin-top:24px">'+(cf?'<div class="flash-cn">'+it.cn+'</div>':'<button style="padding:14px 32px;border-radius:14px;font-size:17px;font-weight:700;background:var(--primary-light);color:var(--primary);border:none;cursor:pointer" onclick="app.fc()">👀 看中文</button>')+'</div></div>'+
'<div style="display:flex;gap:12px"><button class="btn-primary" style="flex:1;background:var(--muted)" onclick="app.pc()" '+(ci===0?"disabled":"")+'>← 上一个</button><button class="btn-primary" style="flex:2" onclick="app.nc()">'+(ci>=ls.length-1?"✅ 完成！":"下一个 →")+'</button></div></div>'}

function rp(){var l=clv(st.xp);var p=l.nextXp>l.xp?Math.round((st.xp-l.xp)/(l.nextXp-l.xp)*100):100;var acc=st.tc+st.tw>0?Math.round(st.tc/(st.tc+st.tw)*100):0;
return '<div class="progress-content fade-in"><div style="text-align:center;padding:28px 0"><div style="font-size:64px;animation:float 3s infinite">🏆</div><div style="font-size:32px;font-weight:900;margin-top:8px">Lv.'+l.lv+'</div><div style="font-size:20px;font-weight:800;color:var(--primary)">'+l.title+'</div></div>'+
'<div class="stat-grid"><div class="stat-card full-width"><div class="stat-label">总经验值</div><div class="stat-value">⭐'+st.xp+' XP</div><div style="margin-top:10px"><div class="xp-bar-bg"><div class="xp-bar-fill" style="width:'+p+'%"></div></div><div style="font-size:12px;color:var(--muted);margin-top:4px">距下一级还需'+(l.nextXp-st.xp)+' XP</div></div></div>'+
'<div class="stat-card"><div class="stat-label">已掌握单词</div><div class="stat-value" style="color:var(--success)">'+gm(st)+'<span style="font-size:16px;color:var(--muted)">/'+gtw()+'</span></div></div>'+
'<div class="stat-card"><div class="stat-label">正确率</div><div class="stat-value" style="color:'+(acc>=70?"var(--success)":"var(--danger)")+'">'+acc+'%</div><div style="font-size:11px;color:var(--muted);margin-top:4px">对'+st.tc+'次·错'+st.tw+'次</div></div></div>'+
'<div class="stat-card full-width" style="margin-top:12px"><div class="stat-label" style="margin-bottom:12px">各单元掌握详情</div>'+
UNITS.map(function(u){var um=gum(st,u.id);return '<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px"><span>'+u.emoji+' U'+u.id+' '+u.title+'</span><span style="color:'+(um.p>=100?'var(--success)':um.p>0?'var(--blue)':'var(--muted)')+'">'+um.m+'/'+um.t+' ('+um.p+'%)</span></div><div class="xp-bar-bg" style="height:8px"><div class="xp-bar-fill" style="width:'+um.p+'%"></div></div><div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">'+u.words.map(function(w){var s=st.wordScores[w.en]||0;var bg=s>=MT?"var(--success-light)":s>0?"var(--blue-light)":"var(--bg)";var co=s>=MT?"var(--success)":s>0?"var(--blue)":"var(--muted)";return '<span style="padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:'+bg+';color:'+co+'">'+w.en+' '+s+'/'+MT+'</span>'}).join("")+'</div></div>'}).join("")+'</div>'+
'<button class="btn-primary" style="margin-top:16px;background:var(--danger)" onclick="if(confirm(\'确定清除所有数据？\'))app.rs()">🗑️ 重置数据</button></div>'}

function rr(){var c="";switch(ct){case "home":c=rho();break;case "chat":c=rc();break;case "cards":c=rca();break;case "progress":c=rp();break}document.getElementById("app").innerHTML=rh()+rn()+c+(xpp!==null?'<div class="xp-popup">+'+xpp+' XP ⭐</div>':'')}

return{render:rr,st:function(t){ct=t;rr()},su:function(id){cu=id;st.cu=id;sv(st);rr()},sc:sc,sm:sm,
si:function(){var i=document.getElementById("ci");if(i&&i.value.trim()){sm(i.value.trim());i.value=""}},
scm:function(m){cm=m;ci=0;cf=false;rr()},fc:function(){cf=true;rr()},
nc:function(){var u=UNITS.find(function(x){return x.id===cu});var ls=cm==="words"?u.words:u.sentences;if(ci>=ls.length-1){ct="home";rr()}else{ci++;cf=false;rr();setTimeout(function(){speak(ls[ci].en)},300)}},
pc:function(){if(ci>0){ci--;cf=false;rr()}},rs:function(){localStorage.removeItem("et_v3");location.reload()}}
}
window.app=App();window.speak=speak;window.app.render();
</script>
</body>
</html>
